# Esuno standard installation (single small server).
#   Configure .env and secrets, then follow docs/deployment/production.md.
#   Fresh installations must bootstrap the management account before normal up.
# Add `--profile dev` for local AWS substitutes (LocalStack).
name: opensuite

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart
  restart: unless-stopped
  logging: *logging

services:
  # Generates local secrets once, into a dedicated volume. Each consumer
  # mounts only its own sub-directory, read-only. Nothing reaches Git or .env.
  secrets:
    logging: *logging
    image: node:24.22.2-trixie-slim@sha256:54f84b4cf8432b21aaffd5d3ce8d41e12cea0d10d33c09d2f3c9879d49d6b446
    command:
      - sh
      - -euc
      - |
        generate() { # directory, owner uid
          mkdir -p "/secrets/$$1"
          if [ ! -s "/secrets/$$1/password" ]; then
            tr -dc 'A-Za-z0-9' </dev/urandom | head -c 40 >"/secrets/$$1/password"
          fi
          chown -R "$$2:$$2" "/secrets/$$1"
          chmod 0500 "/secrets/$$1"
          chmod 0400 "/secrets/$$1/password"
        }
        generate postgres 999
        generate stalwart-admin 2000
        generate stalwart-management 2000
        generate app-database 999
        generate auth 1000
        mkdir -p /secrets/vapid
        if [ ! -s /secrets/vapid/public ] || [ ! -s /secrets/vapid/private ]; then
          umask 077
          node -e 'const {createECDH}=require("node:crypto"), fs=require("node:fs"), key=createECDH("prime256v1"); key.generateKeys(); fs.writeFileSync("/secrets/vapid/private",key.getPrivateKey().toString("base64url")); fs.writeFileSync("/secrets/vapid/public",key.getPublicKey().toString("base64url"));'
        fi
        chown -R 1000:1000 /secrets/vapid
        chmod 0500 /secrets/vapid
        chmod 0400 /secrets/vapid/public /secrets/vapid/private
        mkdir -p /secrets/mailbox-key
        if [ ! -s /secrets/mailbox-key/password ]; then
          od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > /secrets/mailbox-key/password
        fi
        chown -R 1000:1000 /secrets/mailbox-key
        chmod 0500 /secrets/mailbox-key
        chmod 0400 /secrets/mailbox-key/password
        chown 2000:1000 /secrets/stalwart-management /secrets/stalwart-management/password
        chmod 0550 /secrets/stalwart-management
        chmod 0440 /secrets/stalwart-management/password
        mkdir -p /setup-status
        chown 2000:1000 /setup-status
        chmod 0775 /setup-status
        generate drive-database 999
        generate storage-token 999
        chown 999:1000 /secrets/storage-token /secrets/storage-token/password
        chmod 0550 /secrets/storage-token
        chmod 0440 /secrets/storage-token/password
        generate vault-database 999
        chown 999:1000 /secrets/vault-database /secrets/vault-database/password
        chmod 0550 /secrets/vault-database
        chmod 0440 /secrets/vault-database/password
        # Repair fresh and existing Vault volumes before Vault starts.
        mkdir -p /vault-data
        chown -R 1000:1000 /vault-data
        chmod 0700 /vault-data
        chown 999:1000 /secrets/app-database /secrets/app-database/password
        chmod 0550 /secrets/app-database
        chmod 0440 /secrets/app-database/password
    volumes:
      - secrets:/secrets
      - setup-status:/setup-status
      - vaultwarden-data:/vault-data
    network_mode: none

  caddy:
    <<: *restart
    networks:
      default:
      api-proxy:
        ipv4_address: ${API_PROXY_CADDY_IP:-172.28.254.2}
      pass-network:
        ipv4_address: ${VAULT_CADDY_IP:-172.28.253.2}
    image: caddy:2.11.7@sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        [ -s /srv/index.html ] || { echo 'caddy: web dist missing; run pnpm install and pnpm build' >&2; exit 1; }
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      OPENSUITE_SITE_ADDRESS: ${OPENSUITE_SITE_ADDRESS:-localhost}
      OPENSUITE_PUBLIC_HOST: ${OPENSUITE_PUBLIC_HOST:-localhost}
      VAULT_SITE_ADDRESS: ${VAULT_PUBLIC_HOST:-vault.localhost}
      LANDING_SITE_ADDRESS: ${LANDING_SITE_ADDRESS:-landing.localhost}
      MAIL_MANAGEMENT_SUBNET: ${MAIL_MANAGEMENT_SUBNET:-172.30.248.0/24}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv:ro
      - ./apps/landing:/landing:ro
      - ./deploy/vaultwarden/brand:/opt/opensuite/vault-brand:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    <<: *restart
    networks:
      default:
      api-proxy:
        aliases: [api-proxy]
        ipv4_address: ${API_PROXY_API_IP:-172.28.254.3}
      mail-management:
        ipv4_address: ${MAIL_MANAGEMENT_API_IP:-172.30.248.10}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: opensuite-api:local
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ESUNO_DEPLOYMENT_MODE: ${ESUNO_DEPLOYMENT_MODE:-self-hosted}
      STRIPE_SECRET_KEY_FILE: ${STRIPE_SECRET_KEY_FILE:+/run/opensuite/stripe-secret}
      STRIPE_WEBHOOK_SECRET_FILE: ${STRIPE_WEBHOOK_SECRET_FILE:+/run/opensuite/stripe-webhook-secret}
      BILLING_INTERNAL_TOKEN_FILE: /run/opensuite/storage-token/password
      BILLING_INTERNAL_TOKEN_OVERRIDE_FILE: ${BILLING_INTERNAL_TOKEN_FILE:+/run/opensuite/storage-token-override}
      BILLING_DRIVE_ORIGIN: http://drive:3001
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-true}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-}
      READINESS_TIMEOUT_MS: ${READINESS_TIMEOUT_MS:-2000}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-opensuite}
      APP_DATABASE_PASSWORD_FILE: /run/opensuite/app-database/password
      TRUSTED_PROXY_IP: ${API_PROXY_CADDY_IP:-172.28.254.2}
      AUTH_PUBLIC_ORIGIN: https://${OPENSUITE_PUBLIC_HOST:-localhost}
      # Optional separate application origins, e.g.
      # drive=https://drive.example.org,calendar=https://calendar.example.org
      AUTH_PRODUCT_ORIGINS: ${AUTH_PRODUCT_ORIGINS:-}
      VAULT_PUBLIC_HOST: ${VAULT_PUBLIC_HOST:-vault.localhost}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-localhost.test}
      MAIL_DOMAINS: ${MAIL_DOMAINS:-}
      ADDRESS_PER_USER_CAP: ${ADDRESS_PER_USER_CAP:-50}
      STALWART_INTERNAL_ORIGIN: http://stalwart-management:8080
      STALWART_MANAGEMENT_CLIENT_IP: ${MAIL_MANAGEMENT_API_IP:-172.30.248.10}
      VAPID_PUBLIC_KEY_FILE: /run/opensuite/vapid/public
      VAPID_PRIVATE_KEY_FILE: /run/opensuite/vapid/private
      AUTH_SECRET_FILE: /run/opensuite/auth/password
      MAILBOX_KEY_FILE: /run/opensuite/mailbox-key/password
      STALWART_MANAGEMENT_PASSWORD_FILE: /run/opensuite/stalwart-management/password
      DOMAINS_SES_ENABLED: ${DOMAINS_SES_ENABLED:-}
      DOMAINS_SES_RULE: ${DOMAINS_SES_RULE:-}
      DOMAINS_SES_RULE_SET: ${DOMAINS_SES_RULE_SET:-}
      DOMAINS_SES_MODE: ${DOMAINS_SES_MODE:-}
      DOMAINS_ADOPT_DOMAINS: ${DOMAINS_ADOPT_DOMAINS:-}
      DOMAINS_SES_ENDPOINT: ${DOMAINS_SES_ENDPOINT:-}
      DOMAINS_SES_CREDENTIALS_FILE: ${DOMAINS_SES_CREDENTIALS_FILE:+/run/opensuite/domain-ses-credentials}
      DOMAINS_STALWART_ORIGIN: ${DOMAINS_STALWART_ORIGIN:-}
      DOMAINS_STALWART_USER: ${DOMAINS_STALWART_USER:-}
      DOMAINS_STALWART_PASSWORD_FILE: ${DOMAINS_STALWART_PASSWORD_FILE:-}
      DOMAINS_CHECK_INTERVAL_SECONDS: ${DOMAINS_CHECK_INTERVAL_SECONDS:-}
    volumes:
      - type: bind
        source: ${STRIPE_SECRET_KEY_FILE:-/dev/null}
        target: /run/opensuite/stripe-secret
        read_only: true
      - type: bind
        source: ${STRIPE_WEBHOOK_SECRET_FILE:-/dev/null}
        target: /run/opensuite/stripe-webhook-secret
        read_only: true
      - type: bind
        source: ${BILLING_INTERNAL_TOKEN_FILE:-/dev/null}
        target: /run/opensuite/storage-token-override
        read_only: true
      - type: volume
        source: secrets
        target: /run/opensuite/storage-token
        read_only: true
        volume:
          subpath: storage-token
      - type: bind
        source: ${DOMAINS_SES_CREDENTIALS_FILE:-/dev/null}
        target: /run/opensuite/domain-ses-credentials
        read_only: true
      - type: volume
        source: secrets
        target: /run/opensuite/vapid
        read_only: true
        volume:
          subpath: vapid
      - type: volume
        source: secrets
        target: /run/opensuite/app-database
        read_only: true
        volume:
          subpath: app-database
      - type: volume
        source: secrets
        target: /run/opensuite/auth
        read_only: true
        volume:
          subpath: auth
      - type: volume
        source: secrets
        target: /run/opensuite/mailbox-key
        read_only: true
        volume:
          subpath: mailbox-key
      - type: volume
        source: secrets
        target: /run/opensuite/stalwart-management
        read_only: true
        volume:
          subpath: stalwart-management
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  mfa-recovery:
    profiles: [recovery]
    image: opensuite-api:local
    entrypoint: ["node", "scripts/reset-mfa.mjs"]
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-opensuite}
      APP_DATABASE_PASSWORD_FILE: /run/opensuite/app-database/password
    volumes:
      - type: volume
        source: secrets
        target: /run/opensuite/app-database
        read_only: true
        volume:
          subpath: app-database

  # Ingestion needs a separately provisioned queue, buckets and mailbox credentials.
  ingest:
    profiles: [ingest]
    <<: *restart
    stop_grace_period: 2h
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
    image: opensuite-ingest:local
    env_file:
      - path: ${INGEST_ENV_FILE:-./deploy/ingest.env}
        required: false
    # Delivers to every active mailbox linked in the database; the key
    # decrypts their stored credentials. Set both variables empty in .env to
    # deliver only to static destinations.
    environment:
      MAILBOX_KEY_FILE: ${INGEST_MAILBOX_KEY_FILE-/run/opensuite/mailbox-key/password}
      INGEST_MAILBOX_ORIGIN: ${INGEST_MAILBOX_ORIGIN-http://stalwart:8080}
    volumes:
      - type: volume
        source: secrets
        target: /run/opensuite/mailbox-key
        read_only: true
        volume:
          subpath: mailbox-key
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  observe:
    <<: *restart
    build:
      context: .
      dockerfile: apps/observe/Dockerfile
    image: opensuite-observe:local
    env_file:
      - path: ${OBSERVE_ENV_FILE:-./deploy/observe.env}
        required: false
    environment:
      OBSERVE_CERT_HOST: ${OPENSUITE_PUBLIC_HOST:-localhost}
      OBSERVE_MAIL_CERT_HOST: ${MAIL_HOSTNAME:-localhost}
      OBSERVE_MAIL_TLS_ENABLED: ${MAIL_TLS_ENABLED:-0}
    volumes:
      - setup-status:/setup-status:ro
      - type: bind
        source: ${OBSERVE_BACKUP_DIR:-./deploy/backup-status}
        target: /backup
        read_only: true
      - type: bind
        source: ${OBSERVE_DISK_PATH:-/var/lib/docker}
        target: /host-disk
        read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # Drive has its own process and migration; mail does not depend on it.
  drive:
    <<: *restart
    build:
      context: .
      dockerfile: apps/drive/Dockerfile
    image: opensuite-drive:local
    environment:
      POSTGRES_DRIVE_DB: ${POSTGRES_DRIVE_DB:-opensuite_drive}
      DRIVE_DATABASE_PASSWORD_FILE: /run/opensuite/drive-database/password
      DRIVE_SESSION_API: ${DRIVE_SESSION_API:-http://api:3000}
      # Every origin that serves the web application (space or comma separated).
      DRIVE_TRUSTED_ORIGINS: ${DRIVE_TRUSTED_ORIGINS:-https://${OPENSUITE_PUBLIC_HOST:-localhost}}
      DRIVE_S3_ENDPOINT: ${DRIVE_S3_ENDPOINT:?set DRIVE_S3_ENDPOINT}
      DRIVE_S3_PUBLIC_ENDPOINT: ${DRIVE_S3_PUBLIC_ENDPOINT:?set DRIVE_S3_PUBLIC_ENDPOINT}
      DRIVE_S3_BUCKET: ${DRIVE_S3_BUCKET:?set DRIVE_S3_BUCKET}
      DRIVE_S3_PREFIX: ${DRIVE_S3_PREFIX:-drive/}
      DRIVE_S3_REGION: ${DRIVE_S3_REGION:?set DRIVE_S3_REGION}
      DRIVE_S3_ACCESS_KEY: ${DRIVE_S3_ACCESS_KEY:?set DRIVE_S3_ACCESS_KEY}
      DRIVE_S3_SECRET_KEY_FILE: /run/opensuite/drive-s3-secret
      DRIVE_S3_PATH_STYLE: ${DRIVE_S3_PATH_STYLE:-true}
      DRIVE_QUOTA_BYTES: ${DRIVE_QUOTA_BYTES:-}
      ESUNO_DEPLOYMENT_MODE: ${ESUNO_DEPLOYMENT_MODE:-self-hosted}
      DRIVE_INTERNAL_TOKEN_FILE: /run/opensuite/storage-token/password
      DRIVE_INTERNAL_TOKEN_OVERRIDE_FILE: ${BILLING_INTERNAL_TOKEN_FILE:+/run/opensuite/storage-token-override}
      DRIVE_ENTITLEMENTS_TOKEN_FILE: ${DRIVE_ENTITLEMENTS_TOKEN_FILE:+/run/opensuite/entitlements-token}
      DRIVE_ENTITLEMENTS_API: ${DRIVE_ENTITLEMENTS_API:-http://api:3000}
    volumes:
      - type: bind
        source: ${BILLING_INTERNAL_TOKEN_FILE:-/dev/null}
        target: /run/opensuite/storage-token-override
        read_only: true
      - type: volume
        source: secrets
        target: /run/opensuite/storage-token
        read_only: true
        volume:
          subpath: storage-token
      - type: bind
        source: ${DRIVE_ENTITLEMENTS_TOKEN_FILE:-/dev/null}
        target: /run/opensuite/entitlements-token
        read_only: true
      - type: bind
        source: ${DRIVE_S3_SECRET_FILE:?set DRIVE_S3_SECRET_FILE}
        target: /run/opensuite/drive-s3-secret
        read_only: true
      - type: volume
        source: secrets
        target: /run/opensuite/drive-database
        read_only: true
        volume:
          subpath: drive-database
    depends_on:
      drive-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  drive-migrate:
    logging: *logging
    build:
      context: .
      dockerfile: apps/drive/Dockerfile
    image: opensuite-drive:local
    user: "999:999"
    working_dir: /app/apps/drive
    command: ["node", "src/db/migrate.ts"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensuite}
      POSTGRES_DRIVE_DB: ${POSTGRES_DRIVE_DB:-opensuite_drive}
      POSTGRES_DB: ${POSTGRES_DB:-opensuite}
      DRIVE_DATABASE_PASSWORD_FILE: /run/opensuite/drive-database/password
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/opensuite/postgres/password
    volumes:
      - type: volume
        source: secrets
        target: /run/opensuite/postgres
        read_only: true
        volume:
          subpath: postgres
      - type: volume
        source: secrets
        target: /run/opensuite/drive-database
        read_only: true
        volume:
          subpath: drive-database
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    <<: *restart
    networks: [default, pass-network]
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensuite}
      POSTGRES_DB: ${POSTGRES_DB:-opensuite}
      POSTGRES_DRIVE_DB: ${POSTGRES_DRIVE_DB:-opensuite_drive}
      POSTGRES_PASSWORD_FILE: /run/opensuite/postgres/password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - type: volume
        source: secrets
        target: /run/opensuite/postgres
        read_only: true
        volume:
          subpath: postgres
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      secrets:
        condition: service_completed_successfully

  # Provisioning is separate from initdb so upgrades of existing volumes work.
  vault-provision:
    profiles: [vault]
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    logging: *logging
    networks: [pass-network]
    user: "999:999"
    entrypoint: ["/bin/sh", "/opt/opensuite/provision.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensuite}
      POSTGRES_DB: ${POSTGRES_DB:-opensuite}
      POSTGRES_DRIVE_DB: ${POSTGRES_DRIVE_DB:-opensuite_drive}
    volumes:
      - ./deploy/vaultwarden/provision.sh:/opt/opensuite/provision.sh:ro
      - type: volume
        source: secrets
        target: /run/opensuite/postgres
        read_only: true
        volume:
          subpath: postgres
      - type: volume
        source: secrets
        target: /run/opensuite/vault-database
        read_only: true
        volume:
          subpath: vault-database
    depends_on:
      postgres:
        condition: service_healthy
      secrets:
        condition: service_completed_successfully

  vault:
    profiles: [vault]
    <<: *restart
    image: ${VAULT_IMAGE:-vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055}
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,mode=1777"]
    entrypoint: ["/bin/sh", "/opt/opensuite/start.sh"]
    environment:
      DOMAIN: https://${VAULT_PUBLIC_HOST:-vault.localhost}
      VAULT_YUBICO_CLIENT_ID: ${VAULT_YUBICO_CLIENT_ID:-}
      VAULT_YUBICO_SECRET_KEY: ${VAULT_YUBICO_SECRET_KEY:-}
      VAULT_PUBLIC_HOST: ${VAULT_PUBLIC_HOST:-vault.localhost}
      VAULT_MAIN_SITE_ADDRESS: ${OPENSUITE_SITE_ADDRESS:-localhost}
      VAULT_HTTPS_PORT: ${HTTPS_PORT:-443}
      ROCKET_PORT: 8080
      TEMPLATES_FOLDER: /opt/opensuite/vault-templates
      SMTP_EMBED_IMAGES: "false"
      SMTP_FROM_NAME: Esuno Vault
      INVITATION_ORG_NAME: Esuno Vault
      ORG_CREATION_USERS: ${VAULT_ORG_CREATION_USERS:-none}
      SIGNUPS_ALLOWED: ${VAULT_SIGNUPS_ALLOWED:-false}
      INVITATIONS_ALLOWED: ${VAULT_INVITATIONS_ALLOWED:-true}
      IP_HEADER: X-Real-IP
      IP_HEADER_TRUSTED_PROXIES: ${VAULT_CADDY_IP:-172.28.253.2}
      LOGIN_RATELIMIT_SECONDS: ${VAULT_LOGIN_RATELIMIT_SECONDS:-60}
      LOGIN_RATELIMIT_MAX_BURST: ${VAULT_LOGIN_RATELIMIT_MAX_BURST:-10}
      ADMIN_RATELIMIT_SECONDS: ${VAULT_ADMIN_RATELIMIT_SECONDS:-300}
      ADMIN_RATELIMIT_MAX_BURST: ${VAULT_ADMIN_RATELIMIT_MAX_BURST:-3}
      LOG_LEVEL: warn
      EXTENDED_LOGGING: "false"
      VAULT_ALLOW_SAVED_SIGNUPS: ${VAULT_ALLOW_SAVED_SIGNUPS:-false}
      VAULT_SMTP_HOST: ${VAULT_SMTP_HOST:-}
      VAULT_SMTP_FROM: ${VAULT_SMTP_FROM:-}
      VAULT_SMTP_PORT: ${VAULT_SMTP_PORT:-2587}
      VAULT_SMTP_SECURITY: ${VAULT_SMTP_SECURITY:-starttls}
      VAULT_SMTP_USERNAME: ${VAULT_SMTP_USERNAME:-}
      VAULT_PUSH_ENABLED: ${VAULT_PUSH_ENABLED:-false}
      VAULT_PUSH_INSTALLATION_ID: ${VAULT_PUSH_INSTALLATION_ID:-}
      VAULT_PUSH_RELAY_URI: ${VAULT_PUSH_RELAY_URI:-https://push.bitwarden.com}
      VAULT_PUSH_IDENTITY_URI: ${VAULT_PUSH_IDENTITY_URI:-https://identity.bitwarden.com}
    ports:
      - "127.0.0.1:${VAULT_ADMIN_PORT:-8081}:8080"
    volumes:
      # Do not let image /data metadata overwrite the secrets job's repair
      # when Docker creates a container against an empty volume.
      - type: volume
        source: vaultwarden-data
        target: /data
        volume:
          nocopy: true
      - ./deploy/vaultwarden/start.sh:/opt/opensuite/start.sh:ro
      - ./deploy/vaultwarden/yubico.sh:/opt/opensuite/vault-yubico.sh:ro
      - ./deploy/vaultwarden/templates:/opt/opensuite/vault-templates:ro
      - type: volume
        source: secrets
        target: /run/opensuite/vault-database
        read_only: true
        volume:
          subpath: vault-database
      - type: bind
        source: ${VAULT_ADMIN_TOKEN_FILE:-/dev/null}
        target: /run/opensuite/vault-admin-token
        read_only: true
      - type: bind
        source: ${VAULT_SMTP_SECRET_FILE:-/dev/null}
        target: /run/opensuite/vault-smtp-secret
        read_only: true
      - type: bind
        source: ${VAULT_YUBICO_SECRET_FILE:-/dev/null}
        target: /run/opensuite/vault-yubico-secret
        read_only: true
      - type: bind
        source: ${VAULT_PUSH_KEY_FILE:-/dev/null}
        target: /run/opensuite/vault-push-key
        read_only: true
    networks:
      pass-network:
        aliases: [vault]
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      secrets:
        condition: service_completed_successfully
      vault-provision:
        condition: service_completed_successfully

  # Apply versioned migrations before starting the API.
  migrate:
    logging: *logging
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    image: ${OPENSUITE_MIGRATE_IMAGE:-opensuite-migrate:local}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensuite}
      POSTGRES_DB: ${POSTGRES_DB:-opensuite}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/opensuite/postgres/password
      APP_DATABASE_PASSWORD_FILE: /run/opensuite/app-database/password
    volumes:
      - type: volume
        source: secrets
        target: /run/opensuite/postgres
        read_only: true
        volume:
          subpath: postgres
      - type: volume
        source: secrets
        target: /run/opensuite/app-database
        read_only: true
        volume:
          subpath: app-database
    depends_on:
      postgres:
        condition: service_healthy

  stalwart:
    <<: *restart
    image: stalwartlabs/stalwart:v1.0.1@sha256:b9da4df8b4efc06bc926dd6e990bdeb0ad7b9261a7c3893d74b0461a00bb389b
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ "$$MAIL_RELAY_CONFIGURED" = 1 ] && [ ! -s /run/opensuite/smtp-secret ]; then
          echo 'stalwart: configured relay secret is missing or empty' >&2; exit 1
        fi
        exec /usr/local/bin/stalwart --config /etc/stalwart/config.json
    environment:
      MAIL_RELAY_CONFIGURED: ${MAIL_RELAY_CONFIGURED:-0}
      STALWART_HOSTNAME: ${MAIL_HOSTNAME:-localhost}
      STALWART_PUBLIC_URL: https://${OPENSUITE_PUBLIC_HOST:-localhost}
      MAIL_S3_KEY_ID: ${MAIL_S3_KEY_ID:-}
    ports:
      - "${MAIL_PROTOCOL_BIND:-127.0.0.1}:${SUBMISSIONS_PORT:-465}:465"
      - "${MAIL_PROTOCOL_BIND:-127.0.0.1}:${IMAPS_PORT:-993}:993"
      - "${MAIL_PROTOCOL_BIND:-127.0.0.1}:${MANAGESIEVE_PORT:-4190}:4190"
    volumes:
      # Only the data store location; every other setting lives in the store.
      - ./deploy/stalwart/config.json:/etc/stalwart/config.json:ro
      - stalwart-data:/var/lib/stalwart
      - type: bind
        source: ${MAIL_RELAY_SECRET_FILE:-/dev/null}
        target: /run/opensuite/smtp-secret
        read_only: true
      - type: bind
        source: ${MAIL_TLS_CERT_FILE:-/dev/null}
        target: /run/opensuite/tls/fullchain.pem
        read_only: true
      - type: bind
        source: ${MAIL_TLS_KEY_FILE:-/dev/null}
        target: /run/opensuite/tls/privkey.pem
        read_only: true
      - type: bind
        source: ${MAIL_S3_SECRET_FILE:-/dev/null}
        target: /run/opensuite/mail-s3-secret
        read_only: true
    networks:
      default:
      mail-management:
        aliases: [stalwart-management]
        ipv4_address: ${MAIL_MANAGEMENT_STALWART_IP:-172.30.248.20}
    healthcheck:
      # Stalwart trusts X-Forwarded-For (set by the proxy) and rejects loopback
      # values, so the probe identifies itself with the container address.
      test:
        [
          "CMD-SHELL",
          'curl -fsS -H "X-Forwarded-For: $$(hostname -i | cut -d" " -f1)" http://127.0.0.1:8080/healthz/ready',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      secrets:
        condition: service_completed_successfully

  # Applies idempotent server settings (stdout logs, proxy trust) once the
  # mail server is healthy. Safe to re-run on every start.
  stalwart-setup:
    logging: *logging
    image: stalwartlabs/stalwart:v1.0.1@sha256:b9da4df8b4efc06bc926dd6e990bdeb0ad7b9261a7c3893d74b0461a00bb389b
    entrypoint: ["/bin/sh", "/opt/opensuite/setup.sh"]
    environment:
      MAIL_TLS_ENABLED: ${MAIL_TLS_ENABLED:-0}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-localhost}
      MAIL_BLOB_STORE: ${MAIL_BLOB_STORE:-local}
      MAIL_S3_ENDPOINT: ${MAIL_S3_ENDPOINT:-}
      MAIL_S3_REGION: ${MAIL_S3_REGION:-}
      MAIL_S3_BUCKET: ${MAIL_S3_BUCKET:-}
      MAIL_S3_PREFIX: ${MAIL_S3_PREFIX:-}
      MAIL_S3_KEY_ID: ${MAIL_S3_KEY_ID:-}
      MAIL_S3_ALLOW_SWITCH: ${MAIL_S3_ALLOW_SWITCH:-0}
    volumes:
      - ./deploy/stalwart/setup.sh:/opt/opensuite/setup.sh:ro
      - setup-status:/setup-status
      - type: bind
        source: ${MAIL_TLS_CERT_FILE:-/dev/null}
        target: /run/opensuite/tls/fullchain.pem
        read_only: true
      - type: bind
        source: ${MAIL_TLS_KEY_FILE:-/dev/null}
        target: /run/opensuite/tls/privkey.pem
        read_only: true
      - type: bind
        source: ${MAIL_S3_SECRET_FILE:-/dev/null}
        target: /run/opensuite/mail-s3-secret
        read_only: true
      - type: volume
        source: secrets
        target: /run/opensuite/stalwart-management
        read_only: true
        volume:
          subpath: stalwart-management
    networks:
      mail-management:
        ipv4_address: ${MAIL_MANAGEMENT_SETUP_IP:-172.30.248.21}
    depends_on:
      stalwart:
        condition: service_healthy

  # Trusted, short-lived operator command; no management port is published.
  management:
    profiles: [ops]
    image: opensuite-api:local
    entrypoint: ["/bin/sh", "/opt/opensuite/management.sh"]
    environment:
      MAIL_RELAY_CONFIGURED: ${MAIL_RELAY_CONFIGURED:-0}
    networks:
      mail-management:
        ipv4_address: ${MAIL_MANAGEMENT_OPS_IP:-172.30.248.22}
    volumes:
      - ./deploy/stalwart/management.sh:/opt/opensuite/management.sh:ro
      - ./scripts/outbound.mjs:/app/scripts/outbound.mjs:ro
      - ./scripts/ingest-credential.mjs:/app/scripts/ingest-credential.mjs:ro
      - type: volume
        source: secrets
        target: /run/opensuite/stalwart-management
        read_only: true
        volume:
          subpath: stalwart-management
      - type: bind
        source: ${MAIL_RELAY_SECRET_FILE:-/dev/null}
        target: /run/opensuite/smtp-secret
        read_only: true

  localstack:
    profiles: [dev]
    <<: *restart
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a}
    environment:
      SERVICES: s3,sqs
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      INBOUND_BUCKET: ${INBOUND_BUCKET:-opensuite-inbound}
      INBOUND_QUEUE: ${INBOUND_QUEUE:-opensuite-inbound}
      DRIVE_S3_BUCKET: ${DRIVE_S3_BUCKET:-opensuite-drive}
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./deploy/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS http://127.0.0.1:4566/_localstack/init/ready | grep -q ''"completed": true'' && ! curl -fsS http://127.0.0.1:4566/_localstack/init/ready | grep -q ''"state": "ERROR"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  # Internal key kept from the first release so existing installations keep
  # the same network (and Caddy/PostgreSQL endpoints) after the Vault rename.
  pass-network:
    ipam:
      config:
        - subnet: ${VAULT_NETWORK_SUBNET:-172.28.253.0/24}
          ip_range: ${VAULT_NETWORK_IP_RANGE:-172.28.253.128/25}
  api-proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.28.254.0/24
  mail-management:
    ipam:
      config:
        - subnet: ${MAIL_MANAGEMENT_SUBNET:-172.30.248.0/24}

volumes:
  secrets:
  caddy-data:
  caddy-config:
  postgres-data:
  stalwart-data:
  vaultwarden-data:
  localstack-data:
  setup-status:
