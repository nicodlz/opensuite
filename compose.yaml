# OpenSuite standard installation (single small server).
#   cp deploy/env.example .env && docker compose up -d
# Add `--profile dev` for local AWS substitutes (LocalStack).
name: opensuite

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart
  restart: unless-stopped
  logging: *logging

services:
  # Generates local secrets once, into a dedicated volume. Each consumer
  # mounts only its own sub-directory, read-only. Nothing reaches Git or .env.
  secrets:
    logging: *logging
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    command:
      - sh
      - -euc
      - |
        generate() { # directory, owner uid
          mkdir -p "/secrets/$$1"
          if [ ! -s "/secrets/$$1/password" ]; then
            tr -dc 'A-Za-z0-9' </dev/urandom | head -c 40 >"/secrets/$$1/password"
          fi
          chown -R "$$2:$$2" "/secrets/$$1"
          chmod 0500 "/secrets/$$1"
          chmod 0400 "/secrets/$$1/password"
        }
        generate postgres 999
        generate stalwart-admin 2000
        generate app-database 999
        chown 999:1000 /secrets/app-database /secrets/app-database/password
        chmod 0550 /secrets/app-database
        chmod 0440 /secrets/app-database/password
    volumes:
      - secrets:/secrets
    network_mode: none

  caddy:
    <<: *restart
    image: caddy:2.11.7@sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8
    environment:
      OPENSUITE_SITE_ADDRESS: ${OPENSUITE_SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      api:
        condition: service_started
      stalwart:
        condition: service_started

  api:
    <<: *restart
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: opensuite-api:local
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      READINESS_TIMEOUT_MS: ${READINESS_TIMEOUT_MS:-2000}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-opensuite}
      APP_DATABASE_PASSWORD_FILE: /run/opensuite/app-database/password
    volumes:
      - type: volume
        source: secrets
        target: /run/opensuite/app-database
        read_only: true
        volume:
          subpath: app-database
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Ingestion needs a separately provisioned queue, buckets and mailbox credentials.
  ingest:
    profiles: [ingest]
    <<: *restart
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
    image: opensuite-ingest:local
    env_file:
      - path: ${INGEST_ENV_FILE:-./deploy/ingest.env}
        required: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  observe:
    <<: *restart
    build:
      context: .
      dockerfile: apps/observe/Dockerfile
    image: opensuite-observe:local
    env_file:
      - path: ${OBSERVE_ENV_FILE:-./deploy/observe.env}
        required: false
    environment:
      OBSERVE_CERT_HOST: ${OPENSUITE_PUBLIC_HOST:-localhost}
    volumes:
      - type: bind
        source: ${OBSERVE_BACKUP_DIR:-./deploy/backup-status}
        target: /backup
        read_only: true
      - type: bind
        source: ${OBSERVE_DISK_PATH:-/var/lib/docker}
        target: /host-disk
        read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # Drive has its own process and migration; mail does not depend on it.
  drive:
    <<: *restart
    build:
      context: .
      dockerfile: apps/drive/Dockerfile
    image: opensuite-drive:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensuite}
      POSTGRES_DRIVE_DB: ${POSTGRES_DRIVE_DB:-opensuite_drive}
      POSTGRES_PASSWORD_FILE: /run/opensuite/postgres/password
      DRIVE_SESSION_API: ${DRIVE_SESSION_API:-http://api:3000}
      DRIVE_S3_ENDPOINT: ${DRIVE_S3_ENDPOINT:-http://localstack:4566}
      DRIVE_S3_PUBLIC_ENDPOINT: ${DRIVE_S3_PUBLIC_ENDPOINT:-http://localhost:4566}
      DRIVE_S3_BUCKET: ${DRIVE_S3_BUCKET:-opensuite-drive}
      DRIVE_S3_PREFIX: ${DRIVE_S3_PREFIX:-drive/}
      DRIVE_S3_REGION: ${DRIVE_S3_REGION:-us-east-1}
      DRIVE_S3_ACCESS_KEY: ${DRIVE_S3_ACCESS_KEY:-test}
      DRIVE_S3_SECRET_KEY: ${DRIVE_S3_SECRET_KEY:-test}
      DRIVE_S3_PATH_STYLE: ${DRIVE_S3_PATH_STYLE:-true}
      DRIVE_QUOTA_BYTES: ${DRIVE_QUOTA_BYTES:-10000000000}
    volumes:
      - type: volume
        source: secrets
        target: /run/opensuite/postgres
        read_only: true
        volume:
          subpath: postgres
    depends_on:
      drive-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  drive-migrate:
    logging: *logging
    build:
      context: .
      dockerfile: apps/drive/Dockerfile
    image: opensuite-drive:local
    user: "999:999"
    working_dir: /app/apps/drive
    command: ["node", "src/db/migrate.ts"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensuite}
      POSTGRES_DRIVE_DB: ${POSTGRES_DRIVE_DB:-opensuite_drive}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/opensuite/postgres/password
    volumes:
      - type: volume
        source: secrets
        target: /run/opensuite/postgres
        read_only: true
        volume:
          subpath: postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *restart
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensuite}
      POSTGRES_DB: ${POSTGRES_DB:-opensuite}
      POSTGRES_DRIVE_DB: ${POSTGRES_DRIVE_DB:-opensuite_drive}
      POSTGRES_PASSWORD_FILE: /run/opensuite/postgres/password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - type: volume
        source: secrets
        target: /run/opensuite/postgres
        read_only: true
        volume:
          subpath: postgres
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      secrets:
        condition: service_completed_successfully

  # Apply versioned migrations before starting the API.
  migrate:
    logging: *logging
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    image: opensuite-migrate:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensuite}
      POSTGRES_DB: ${POSTGRES_DB:-opensuite}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/opensuite/postgres/password
      APP_DATABASE_PASSWORD_FILE: /run/opensuite/app-database/password
    volumes:
      - type: volume
        source: secrets
        target: /run/opensuite/postgres
        read_only: true
        volume:
          subpath: postgres
      - type: volume
        source: secrets
        target: /run/opensuite/app-database
        read_only: true
        volume:
          subpath: app-database
    depends_on:
      postgres:
        condition: service_healthy

  stalwart:
    <<: *restart
    image: stalwartlabs/stalwart:v1.0.1@sha256:b9da4df8b4efc06bc926dd6e990bdeb0ad7b9261a7c3893d74b0461a00bb389b
    # The admin password is generated by `secrets` and never stored in .env.
    entrypoint:
      - /bin/sh
      - -c
      - STALWART_RECOVERY_ADMIN="admin:$$(cat /run/opensuite/stalwart-admin/password)" exec /usr/local/bin/stalwart --config /etc/stalwart/config.json
    environment:
      STALWART_HOSTNAME: ${MAIL_HOSTNAME:-localhost}
      STALWART_PUBLIC_URL: https://${OPENSUITE_PUBLIC_HOST:-localhost}
      MAIL_S3_KEY_ID: ${MAIL_S3_KEY_ID:-}
    ports:
      - "${SMTP_PORT:-25}:25"
      - "${SUBMISSIONS_PORT:-465}:465"
      - "${IMAPS_PORT:-993}:993"
      - "${MANAGESIEVE_PORT:-4190}:4190"
    volumes:
      # Only the data store location; every other setting lives in the store.
      - ./deploy/stalwart/config.json:/etc/stalwart/config.json:ro
      - stalwart-data:/var/lib/stalwart
      - type: bind
        source: ${MAIL_RELAY_SECRET_FILE:-/dev/null}
        target: /run/opensuite/smtp-secret
        read_only: true
      - type: bind
        source: ${MAIL_S3_SECRET_FILE:-/dev/null}
        target: /run/opensuite/mail-s3-secret
        read_only: true
      - type: volume
        source: secrets
        target: /run/opensuite/stalwart-admin
        read_only: true
        volume:
          subpath: stalwart-admin
    healthcheck:
      # Stalwart trusts X-Forwarded-For (set by the proxy) and rejects loopback
      # values, so the probe identifies itself with the container address.
      test:
        [
          "CMD-SHELL",
          'curl -fsS -H "X-Forwarded-For: $$(hostname -i | cut -d" " -f1)" http://127.0.0.1:8080/healthz/ready',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      secrets:
        condition: service_completed_successfully

  # Applies idempotent server settings (stdout logs, proxy trust) once the
  # mail server is healthy. Safe to re-run on every start.
  stalwart-setup:
    logging: *logging
    image: stalwartlabs/stalwart:v1.0.1@sha256:b9da4df8b4efc06bc926dd6e990bdeb0ad7b9261a7c3893d74b0461a00bb389b
    entrypoint: ["/bin/sh", "/opt/opensuite/setup.sh"]
    environment:
      MAIL_BLOB_STORE: ${MAIL_BLOB_STORE:-local}
      MAIL_S3_ENDPOINT: ${MAIL_S3_ENDPOINT:-}
      MAIL_S3_REGION: ${MAIL_S3_REGION:-}
      MAIL_S3_BUCKET: ${MAIL_S3_BUCKET:-}
      MAIL_S3_PREFIX: ${MAIL_S3_PREFIX:-}
      MAIL_S3_KEY_ID: ${MAIL_S3_KEY_ID:-}
      MAIL_S3_ALLOW_SWITCH: ${MAIL_S3_ALLOW_SWITCH:-0}
    volumes:
      - ./deploy/stalwart/setup.sh:/opt/opensuite/setup.sh:ro
      - type: bind
        source: ${MAIL_S3_SECRET_FILE:-/dev/null}
        target: /run/opensuite/mail-s3-secret
        read_only: true
      - type: volume
        source: secrets
        target: /run/opensuite/stalwart-admin
        read_only: true
        volume:
          subpath: stalwart-admin
    depends_on:
      stalwart:
        condition: service_healthy

  localstack:
    profiles: [dev]
    <<: *restart
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a}
    environment:
      SERVICES: s3,sqs
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      INBOUND_BUCKET: ${INBOUND_BUCKET:-opensuite-inbound}
      INBOUND_QUEUE: ${INBOUND_QUEUE:-opensuite-inbound}
      DRIVE_S3_BUCKET: ${DRIVE_S3_BUCKET:-opensuite-drive}
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./deploy/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS http://127.0.0.1:4566/_localstack/init/ready | grep -q ''"completed": true'' && ! curl -fsS http://127.0.0.1:4566/_localstack/init/ready | grep -q ''"state": "ERROR"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  secrets:
  caddy-data:
  caddy-config:
  postgres-data:
  stalwart-data:
  localstack-data:
