# Isolated integration-test overlay; no public host ports.
services:
  stalwart:
    ports: !override
      - "127.0.0.1::8080"
      - "127.0.0.1::993"
    volumes:
      - type: volume
        source: secrets
        target: /run/opensuite/stalwart-management
        read_only: true
        volume:
          subpath: stalwart-management
  caddy:
    # This protocol fixture does not build or serve the web application.
    entrypoint: ["caddy"]
    command:
      ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      OPENSUITE_SITE_ADDRESS: ":80"
    ports: !override
      - "127.0.0.1::80"
  localstack:
    ports: !override []
    # This suite uses the AWS CLI against SeaweedFS, not LocalStack's S3/SQS fixtures.
    volumes: !override
      - localstack-data:/var/lib/localstack
  object-store:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    command: ["server", "-ip.bind=0.0.0.0", "-filer", "-s3"]
    environment:
      AWS_ACCESS_KEY_ID: local-fixture-key
      AWS_SECRET_ACCESS_KEY: local-fixture-secret
    volumes:
      - mail-test-objects:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mail-test-objects:
