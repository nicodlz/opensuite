# Isolated integration-test overlay; no public host ports.
services:
  stalwart:
    ports: !override
      - "127.0.0.1::8080"
  localstack:
    ports: !override []
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: local-fixture-key
      MINIO_ROOT_PASSWORD: local-fixture-secret
    volumes:
      - mail-test-objects:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mail-test-objects:
