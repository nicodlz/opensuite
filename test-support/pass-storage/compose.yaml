services:
  postgres:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    command: ["postgres", "-c", "fsync=off"]
    environment:
      POSTGRES_INITDB_ARGS: --no-sync
      POSTGRES_DB: vaultwarden
      POSTGRES_USER: vaultwarden
      POSTGRES_PASSWORD: disposable-postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultwarden -d vaultwarden"]
      interval: 2s
      timeout: 3s
      retries: 90
    volumes:
      - postgres:/var/lib/postgresql
    networks: [db]

  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: s3
    ports:
      - "127.0.0.1::4566"
    networks: [s3]

  vaultwarden:
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 3s
      timeout: 5s
      retries: 80
    image: ${POC_IMAGE:?}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vaultwarden:disposable-postgres-password@postgres:5432/vaultwarden
      DATA_FOLDER: /data
      ATTACHMENTS_FOLDER: ${POC_ATTACHMENTS_URI:?}
      SENDS_FOLDER: ${POC_SENDS_URI:?}
      AWS_ACCESS_KEY_ID: ${POC_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${POC_SECRET_KEY:?}
      AWS_EC2_METADATA_DISABLED: "true"
      SIGNUPS_ALLOWED: "true"
      SIGNUPS_VERIFY: "false"
      DISABLE_ADMIN_TOKEN: "true"
      DOMAIN: ${POC_DOMAIN:-http://localhost}
      LOG_LEVEL: warn
    volumes:
      - data:/data
    networks: [db, s3]

  gateway:
    image: caddy:2.11.7@sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8
    command:
      [
        "caddy",
        "reverse-proxy",
        "--from",
        "http://:80",
        "--to",
        "vaultwarden:80",
      ]
    depends_on:
      vaultwarden:
        condition: service_healthy
    ports:
      - "127.0.0.1::80"
    networks: [db, access]

networks:
  db:
    internal: true
  s3: {}
  access: {}

volumes:
  postgres: {}
  data: {}
