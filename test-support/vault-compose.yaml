# Disposable Vault-only integration fixture; no real external resources.
services:
  caddy:
    entrypoint:
      [
        "caddy",
        "run",
        "--config",
        "/etc/caddy/Caddyfile",
        "--adapter",
        "caddyfile",
      ]
    environment:
      OPENSUITE_SITE_ADDRESS: localhost
    networks:
      api-proxy:
        ipv4_address: ${API_PROXY_CADDY_IP}
      pass-network:
        ipv4_address: ${VAULT_CADDY_IP}
    ports: !override
      - "127.0.0.1::443"
  vault:
    environment:
      DOMAIN: ${VAULT_TEST_DOMAIN:-https://vault.localhost}
      IP_HEADER_TRUSTED_PROXIES: ${VAULT_CADDY_IP}
    ports: !override
      - "127.0.0.1::8080"
