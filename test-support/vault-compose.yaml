# Disposable Vault-only integration fixture; no real external resources.
services:
  caddy:
    entrypoint:
      [
        "caddy",
        "run",
        "--config",
        "/etc/caddy/Caddyfile",
        "--adapter",
        "caddyfile",
      ]
    environment:
      OPENSUITE_SITE_ADDRESS: localhost
    networks:
      api-proxy:
        ipv4_address: ${VAULT_TEST_API_IP}
      vault-network:
        ipv4_address: ${VAULT_TEST_PROXY_IP}
    ports: !override
      - "127.0.0.1::443"
  vault:
    environment:
      DOMAIN: ${VAULT_TEST_DOMAIN:-https://vault.localhost}
      IP_HEADER_TRUSTED_PROXIES: ${VAULT_TEST_PROXY_IP}
    ports: !override
      - "127.0.0.1::8080"
networks:
  api-proxy:
    ipam:
      config: !override
        - subnet: ${VAULT_TEST_API_SUBNET}
  vault-network:
    ipam:
      config: !override
        - subnet: ${VAULT_TEST_SUBNET}
          ip_range: ${VAULT_TEST_DYNAMIC_RANGE}
