services:
  postgres:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: ingest
      POSTGRES_INITDB_ARGS: --no-sync
    command: ["postgres", "-c", "fsync=off"]
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest"]
      interval: 2s
      timeout: 2s
      retries: 60
    volumes:
      - database:/var/lib/postgresql
  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: s3,sqs
      INBOUND_BUCKET: inbound
      ARCHIVE_BUCKET: archive
      INBOUND_QUEUE: inbound
    ports:
      - "127.0.0.1::4566"
    volumes:
      - ../deploy/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - aws:/var/lib/localstack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS http://127.0.0.1:4566/_localstack/init/ready | grep -q ''"completed": true''',
        ]
      interval: 2s
      timeout: 3s
      retries: 90
  stalwart:
    image: stalwartlabs/stalwart:v1.0.1@sha256:b9da4df8b4efc06bc926dd6e990bdeb0ad7b9261a7c3893d74b0461a00bb389b
    environment:
      STALWART_RECOVERY_ADMIN: admin:integration-password
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ../deploy/stalwart/config.json:/etc/stalwart/config.json:ro
      - mail:/var/lib/stalwart
    command: ["--config", "/etc/stalwart/config.json"]
volumes:
  database:
  aws:
  mail:
